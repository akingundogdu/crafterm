name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (renderer + preload)
        run: npx tsc --noEmit -p tsconfig.web.json

      - name: Typecheck (main + preload)
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Build
        run: npm run build
