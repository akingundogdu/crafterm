<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crafterm</title>
  </head>
  <body>
    <div id="app" class="orient-left">
      <div id="collapsed-topbar">
        <button id="sidebar-show" title="Show sidebar (⌘B)" aria-label="Show sidebar">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <rect x="1.6" y="2.6" width="12.8" height="10.8" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4" />
            <line x1="6" y1="2.6" x2="6" y2="13.4" stroke="currentColor" stroke-width="1.4" />
          </svg>
        </button>
      </div>
      <aside id="sidebar">
        <div id="drag-region"></div>
        <div id="sidebar-tabs">
          <button id="tab-terminal" class="active">Terminal</button>
          <button id="tab-notebook">Notebook</button>
          <button id="tab-database">Database</button>
          <button id="tab-docker">Docker</button>
          <button id="tab-accounts">Accounts</button>
        </div>
        <div id="sidebar-search">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.5" />
              <line x1="10.2" y1="10.2" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <input id="search-input" type="text" placeholder="Search…" spellcheck="false" />
          </div>
          <button id="toggle-all-folders" title="Expand / collapse all folders" aria-label="Expand or collapse all folders">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path d="M4.5 6.2 8 2.7l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M4.5 9.8 8 13.3l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button id="sidebar-actions" title="More actions" aria-label="More actions">⋮</button>
        </div>
        <div id="tab-list"></div>
        <div id="sidebar-footer">
          <button id="new-tab" title="New terminal (⌘T)">
            <span class="btn-label">Terminal</span><span class="kbd">⌘T</span>
          </button>
          <button id="new-claude" title="New Claude terminal (⇧⌘T)">
            <span class="btn-label">Claude</span><span class="kbd">⇧⌘T</span>
          </button>
          <button id="new-folder" title="New folder (⇧⌘N)">+ Folder</button>
          <button id="new-project" title="New project">+ Project</button>
          <button id="settings-btn" title="Settings (⌘,)">&#9881;</button>
        </div>
        <div id="notebook-footer">
          <button id="nb-new-note" title="New note (⌘N)">
            <span class="btn-label">Note</span><span class="kbd">⌘N</span>
          </button>
          <button id="nb-new-folder" title="New folder (⇧⌘N)">
            <span class="btn-label">Folder</span><span class="kbd">⇧⌘N</span>
          </button>
          <button id="nb-link-file" title="Link an external file to the notebook">
            <span class="btn-label">Link</span>
          </button>
          <button id="nb-settings-btn" title="Settings (⌘,)">&#9881;</button>
        </div>
        <div id="database-footer">
          <button id="db-new-project" title="New database project">
            <span class="btn-label">+ Project</span>
          </button>
          <button id="db-settings-btn" title="Settings (⌘,)">&#9881;</button>
        </div>
        <div id="docker-footer">
          <button id="docker-refresh" title="Refresh docker view">
            <span class="btn-label">⟳ Refresh</span>
          </button>
          <button id="docker-settings-btn" title="Settings (⌘,)">&#9881;</button>
        </div>
        <div id="accounts-footer">
          <button id="accounts-new-entry" title="New account">
            <span class="btn-label">+ Account</span>
          </button>
          <button id="accounts-new-secret" title="New secret (env var)">
            <span class="btn-label">+ Secret</span>
          </button>
          <button id="accounts-settings-btn" title="Settings (⌘,)">&#9881;</button>
        </div>
      </aside>
      <div id="sidebar-resizer"></div>
      <div id="content-col">
        <div id="content-statusbar">
          <button id="statusbar-sidebar-toggle" title="Toggle sidebar (⌘B)" aria-label="Toggle sidebar">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <rect x="1.6" y="2.6" width="12.8" height="10.8" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4" />
              <line x1="6" y1="2.6" x2="6" y2="13.4" stroke="currentColor" stroke-width="1.4" />
            </svg>
          </button>
          <div id="content-statusbar-drag"></div>
          <button id="statusbar-version" title="App version" aria-label="App version">
            <span class="version-dot"></span>
            <span class="version-text">v—</span>
          </button>
          <button id="statusbar-claude-usage" title="Claude usage" aria-label="Claude usage">
            <span class="usage-icon">⌬</span>
            <span class="usage-text">—</span>
          </button>
          <button id="statusbar-usage-refresh" title="Refresh usage" aria-label="Refresh usage">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              <path d="M13.7 2.2v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button id="statusbar-notif-toggle" title="Toggle notifications (⌥⌘→)" aria-label="Toggle notifications">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <rect x="1.6" y="2.6" width="12.8" height="10.8" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4" />
              <line x1="10" y1="2.6" x2="10" y2="13.4" stroke="currentColor" stroke-width="1.4" />
            </svg>
            <span id="notif-badge"></span>
          </button>
        </div>
        <main id="content"></main>
      </div>
      <div id="notif-resizer"></div>
      <aside id="notif-panel" aria-label="Notifications">
        <div id="notif-head">
          <div class="notif-tabs">
            <button id="notif-tab-notifs" class="notif-tab active">Alerts</button>
            <button id="notif-tab-reminders" class="notif-tab">Reminders</button>
            <button id="notif-tab-files" class="notif-tab">Files</button>
            <button id="notif-tab-time" class="notif-tab">Time</button>
            <button id="notif-tab-pr" class="notif-tab">PR</button>
            <button id="notif-tab-bm" class="notif-tab">Bookmarks</button>
          </div>
          <button id="notif-hide" title="Hide (⌥⌘→)" aria-label="Hide panel">×</button>
        </div>
        <div id="notif-notifs-view">
          <div class="notif-toolbar">
            <button id="notif-clear" title="Clear all notifications">Clear all</button>
          </div>
          <div id="notif-list"></div>
        </div>
        <div id="notif-reminders-view">
          <div class="notif-toolbar">
            <button id="notif-add-reminder" title="New reminder">+ Reminder</button>
          </div>
          <div id="reminder-list"></div>
        </div>
        <div id="notif-files-view">
          <div class="explorer-bar">
            <span id="explorer-root" title=""></span>
            <button id="explorer-refresh" title="Refresh">⟳</button>
          </div>
          <input id="explorer-search" class="explorer-search" type="text" placeholder="Search files…" spellcheck="false" />
          <div id="explorer-tree"></div>
        </div>
        <div id="notif-time-view">
          <div class="time-controls">
            <select id="time-project" class="settings-select"></select>
            <div class="time-feature-row">
              <select id="time-feature" class="settings-select"></select>
              <button id="time-add-feature" title="New feature">+</button>
            </div>
            <div class="time-timer">
              <span id="time-elapsed">00:00:00</span>
              <button id="time-toggle">Start</button>
            </div>
            <div class="time-pomodoro">
              <span class="time-pom-label">Pomodoro</span>
              <button class="time-pom-preset" data-min="25">25m</button>
              <button class="time-pom-preset" data-min="30">30m</button>
              <button class="time-pom-preset" data-min="40">40m</button>
            </div>
            <div class="time-pom-custom">
              <input id="time-pom-min" type="number" min="1" max="600" placeholder="min" />
              <label class="time-pom-repeat"><input id="time-pom-repeat" type="checkbox" /> repeat</label>
              <button id="time-pom-start">Start timer</button>
            </div>
          </div>
          <div class="time-report-bar">
            <button id="time-report-btn">View report</button>
          </div>
          <div id="time-summary"></div>
        </div>
        <div id="notif-pr-view"></div>
        <div id="notif-bm-view"></div>
      </aside>
      <button id="equalize-btn" title="Distribute panes evenly (⇧⌘E)">⊞</button>
    </div>
    <div id="update-overlay" hidden>
      <div class="update-overlay-card">
        <div class="update-spinner"></div>
        <div class="update-overlay-text">Updating Crafterm…</div>
        <div class="update-overlay-sub">Loading sessions</div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
